[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-ai-adoption"
version = "2.0.0"
description = "Evidence-led corporate AI adoption and workforce investment decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "DATA_NOTICE.md"]
authors = [{name = "Haojian Dui"}]
dependencies = []

[project.optional-dependencies]
collect = ["beautifulsoup4>=4.12,<5", "pypdf[crypto]>=5,<7", "truststore>=0.10,<1"]
dev = ["pytest>=8,<10", "build>=1,<2", "jsonschema>=4.20,<5"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
corporate-ai = "corporate_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corporate_ai = ["data/*.json", "schemas/*.json", "web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
